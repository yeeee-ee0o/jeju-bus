<!DOCTYPE html>
<html lang="ko">
<head>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">
        <a href="/">
            <span class="bus-icon">🚌</span> JEJU BUS

    </div>
    <div class="nav-links">
        <a href="/">홈으로</a>
        <a href="/login">로그인</a>

<main class="hero-section">
    <div class="content-container">
        <h2 class="page-title">💬 생생한 여행 후기</h2>

        <div class="info-card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">

        </div>

        <div class="info-card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">

        </div>

    <div class="footer-greeting">
        제주 버스와 함께,<br>더 즐거운 제주 여행 되세요! 🙂
