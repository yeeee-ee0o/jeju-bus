<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JEJU BUS - 즐겨찾기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        header {
            background-color: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        header a {
            text-decoration: none;
            color: #3b82f6;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 20px;
        }
        .bookmark-list {
            list-style: none;
            padding: 0;
        }
        .bookmark-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f1f5f9;
        }
        .bookmark-item:last-child {
            border-bottom: none;
        }
        .empty-msg {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

<header>
    <a href="/">🚌 JEJU BUS</a>
</header>

<div class="container">
    <h2>⭐ 나의 즐겨찾기</h2>

    <!-- 1. 즐겨찾기 목록이 존재할 때 (th:if) -->
    <ul class="bookmark-list" th:if="${not #lists.isEmpty(bookmarks)}">
        <li class="bookmark-item" th:each="bookmark : ${bookmarks}">
            <span th:text="${bookmark.name}">🚌 정류장/노선 이름</span>
            <span>⭐</span>
        </li>
    </ul>

    <!-- 2. 즐겨찾기가 비어있을 때 (th:if) -->
    <div class="empty-msg" th:if="${#lists.isEmpty(bookmarks)}">
        등록된 즐겨찾기가 없습니다.
    </div>
</div>

</body>
</html>
