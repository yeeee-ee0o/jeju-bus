<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JEJU BUS - 정류장 검색</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        header {
            background-color: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        header a {
            text-decoration: none;
            color: #3b82f6;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        h2 {
            color: #1e3a8a;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input[type="text"] {
            width: 70%;
            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            padding: 10px 20px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

<header>
    <a href="/">🚌 JEJU BUS</a>
</header>

<div class="container">
    <h2>📍 정류장 검색</h2>
    <div class="search-box">
        <input type="text" placeholder="정류장 이름 또는 번호를 입력하세요 (예: 제주시청)">
        <button>검색</button>
    </div>
</div>

</body>
</html>
