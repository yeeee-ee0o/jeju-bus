<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEJU BUS - 검색 결과</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">
        <a href="/">
            <span class="bus-icon">🚌</span> JEJU BUS
        </a>
    </div>
    <div class="nav-links">
        <a href="/">홈으로</a>
        <a href="/login">로그인</a>
    </div>
</header>

<main class="hero-section">
    <div class="content-container">
        <h2 class="page-title">🔍 검색 결과</h2>

        <div class="info-card">
            <h3 style="font-size: 16px; margin-bottom: 8px; color: #1a73e8;">버스 노선 검색 결과</h3>
            <p style="font-size: 14px; color: #555; margin-bottom: 12px;">입력하신 검색어와 일치하는 노선 정보입니다.</p>

            <div style="background: #f8f9fa; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span style="font-weight: bold; font-size: 16px;">🚌 201번</span>
                    <span style="font-size: 13px; color: #666; margin-left: 10px;">제주버스터미널 ↔ 서귀포환승정류장</span>
                </div>
                <a href="/arrival" style="background: #1a73e8; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 13px;">도착정보</a>
            </div>
        </div>
    </div>

    <div class="footer-greeting">
        제주 버스와 함께,<br>더 즐거운 제주 여행 되세요! 🙂
    </div>
</main>

</body>
</html>
