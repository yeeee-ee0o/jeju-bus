<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEJU BUS - 로그인</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- 상단 네비게이션 바 -->
<header class="navbar">
    <div class="logo">
        <a href="/" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px;">
            <span class="bus-icon">🚌</span> JEJU BUS
        </a>
    </div>
    <div class="weather-info">
        ☀️ 제주도 22°C
    </div>
</header>

<!-- 메인 컨텐츠 영역 -->
<main class="hero-section">
    <div class="hero-content">
        <h1>편리한 JEJU BUS 이용을 위해<br>로그인해주세요</h1>
        <p style="margin-bottom: 20px;"></p>

        <!-- 로그인 카드 폼 -->
        <div class="auth-card">
            <form action="/login" method="post">
                <div class="input-group">
                    <label>아이디</label>
                    <input type="text" placeholder="아이디를 입력하세요" required>
                </div>

                <div class="input-group">
                    <label>비밀번호</label>
                    <input type="password" placeholder="비밀번호를 입력하세요" required>
                </div>

                <button type="submit" class="auth-submit-btn">로그인</button>
            </form>

            <div class="auth-links">
                <a href="#">아이디 찾기</a>
                <span class="divider">|</span>
                <a href="#">비밀번호 재설정</a>
                <span class="divider">|</span>
                <a href="/signup">회원가입</a>
            </div>
        </div>
    </div>

    <!-- 하단 안내 문구 -->
    <div class="footer-greeting" style="margin-top: 30px;">
        제주 버스와 함께,<br>더 즐거운 제주 여행 되세요! 🙂
    </div>
</main>

</body>
</html>
